name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env file
        run: |
          printf '%s\n' \
            'PUBLIC_URL=/' \
            'APP_CONFIG=config/default.js' \
            'USE_HASH_ROUTER=false' \
            'APP_ENV=production' \
            'GOOGLE_CLIENT_ID=218118243126-951d7vd9ie6ac8ga6o886pdjcc1chjrf.apps.googleusercontent.com' \
            'SERVER_URL_LOCAL=http://localhost:8000' \
            'SERVER_URL_PRODUCTION=http://18.225.42.119:8000' \
            > platform/app/.env

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn run build

      - name: Copy build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "platform/app/dist/*"
          target: "/home/ubuntu/frontend-deploy"
          strip_components: 3

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/nivalon/*
            sudo cp -r /home/ubuntu/frontend-deploy/* /var/www/nivalon/
            rm -rf /home/ubuntu/frontend-deploy
            sudo systemctl reload nginx
