name: Nivalon Frontend Publish

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: YARN Install
      run: yarn install

    - name: YARN Publish
      run: yarn run build

    - name: Set Package ENV
      run: echo "PACKAGE=nivalon-frontend-$(date +%Y.%m.%d.%H:%M).tar.gz" >> $PACKAGE

    - name: Tarball Build Artifacts
      run: tar -czf nivalon-frontend-${{ env.PACKAGE }} ./platform/app/dist
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
        aws-region: ${{ secrets.AWS_S3_BUCKET_REGION }}

    - name: Upload artifacts to AWS S3
      uses: usualdesigner/s3-artifact-upload@main
      with:
        bucket-name: ${{ secrets.AWS_S3_BUCKET }}
        file: nivalon-frontend-${{ env.PACKAGE }}
        destination-key: nivalon-frontend-${{ env.PACKAGE }}