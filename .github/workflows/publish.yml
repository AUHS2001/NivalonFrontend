name: Deploy to Staging

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-api:
    name: Build & Deploy API to EC2 Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push Docker image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/nivalon-frontend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/nivalon-frontend:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/nivalon-frontend:cache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/nivalon-frontend:cache,mode=max

      - name: Deploy API to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/nivalon-staging/NivalonFrontend

            # Pull latest code
            git pull origin main

            # Login to ECR
            aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 545705576303.dkr.ecr.us-east-2.amazonaws.com

            # Pull latest image
            docker compose -f docker-compose.staging.yml pull

            # Restart with new code
            docker compose -f docker-compose.staging.yml up -d --force-recreate

            echo "✅ Frontend deployment complete!"