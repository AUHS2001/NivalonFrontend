name: Nivalon Frontend Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: NPM Install
      run: npm i --legacy-peer-deps

    - name: YARN Install
      run: yarn install

    - name: YARN Publish
      run: yarn run build

    - name: Set version info
      run: echo "VERSION=$(date +%Y.%m.%d.%H:%M)" >> $VERSION

    - name: Tarball Build Artifacts
      run: tar -czf build-artifacts-$VERSION.tar.gz ./platform/app/dist

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
        aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY_SECRET }}
        aws-region: ${{ secrets.AWS_S3_BUCKET_REGION }}

    - name: Upload artifacts to AWS S3
      uses: usualdesigner/s3-artifact-upload@main
      with:
        bucket-name: ${{ secrets.AWS_S3_BUCKET }}
        file: build-artifacts-$VERSION.tar.gz
        destination-key: build-artifacts-$VERSION.tar.gz

