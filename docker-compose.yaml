name: NivalonMedical

services:
  frontend:
    image: nivalon-frontend:latest
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      nivalon:
        aliases:
          - "frontend"

  backend:
    image: nivalon-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      nivalon:
        aliases:
          - "backend"

  postgres:
    container_name: "postgres"
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      nivalon:
        aliases:
          - "db"

networks:
  nivalon:
    driver: bridge